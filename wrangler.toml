# Cloudflare Pages — sitio estático.
# next build (output: "export") genera ./out, que Pages sube.
# Con pages_build_output_dir definido, el deploy command "npx wrangler pages
# deploy" (sin argumentos) toma el directorio y el nombre de proyecto de aquí.
# El dominio (psugang.com) se configura en el panel: Pages > Custom domains.
name = "psugangcalculator"
compatibility_date = "2024-09-23"
pages_build_output_dir = "out"
