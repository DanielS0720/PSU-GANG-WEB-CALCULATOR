name = "psugangcalculator"
compatibility_date = "2024-09-23"

# Solo servir en el dominio propio. Desactiva la URL *.workers.dev.
workers_dev = false
routes = [
  { pattern = "psugang.com", custom_domain = true },
]

# Sitio estático (next build con output: "export" -> ./out).
# Se despliega como Workers static assets: wrangler deploy.
[assets]
directory = "./out"
